name: Javadocs

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  javadocs:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Isolate Gradle state from other jobs on self-hosted runners.
      - name: Prepare Gradle home
        shell: bash
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check Javadoc coverage
        run: ./gradlew --build-cache javadocCoverageCheck

      - name: Upload Javadoc coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-coverage
          path: build/reports/javadoc-coverage
          if-no-files-found: ignore
