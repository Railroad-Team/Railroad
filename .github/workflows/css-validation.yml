name: CSS Validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  css-validation:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Keep dependencies and daemons warm; isolate each PR from trusted builds.
      - name: Prepare Gradle home
        shell: bash
        env:
          GRADLE_CACHE_SCOPE: ${{ github.repository }}/${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}
        run: echo "GRADLE_USER_HOME=$RUNNER_TOOL_CACHE/railroad-gradle/$GRADLE_CACHE_SCOPE" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # The self-hosted runner retains its local cache between jobs.
          cache-disabled: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Validate JavaFX CSS
        run: ./gradlew --build-cache cssValidationTest validateJavafxCss
