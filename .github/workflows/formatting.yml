name: Formatting

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  formatting:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js for CSS formatting
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Isolate Gradle state from other jobs on self-hosted runners.
      - name: Prepare Gradle home
        shell: bash
        run: echo "GRADLE_USER_HOME=$RUNNER_TEMP/gradle-home" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check formatting
        env:
          FORMAT_RATCHET_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$FORMAT_RATCHET_FROM" = "0000000000000000000000000000000000000000" ]; then
            FORMAT_RATCHET_FROM="$(git rev-list --max-parents=0 HEAD)"
          fi
          ./gradlew --build-cache -PformatRatchetFrom="$FORMAT_RATCHET_FROM" formatCheck
