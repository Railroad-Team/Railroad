name: Close request-context issue after merge

on:
  pull_request:
    branches: [sst]
    types: [closed]

permissions: {}

jobs:
  close-issue:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'feat/sst-request-context-202'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close issue 202
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            await github.rest.issues.update({
              ...context.repo,
              issue_number: 202,
              state: 'closed',
              state_reason: 'completed'
            });
