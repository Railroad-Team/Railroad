name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      # Cache Gradle dependencies (speeds up builds)
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # GitHub uses gradle 9.0, which doesn't work, so I have to force it to use ./gradlew
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check formatting and build
        env:
          FORMAT_RATCHET_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$FORMAT_RATCHET_FROM" = "0000000000000000000000000000000000000000" ]; then
            FORMAT_RATCHET_FROM="$(git rev-list --max-parents=0 HEAD)"
          fi
          ./gradlew -PformatRatchetFrom="$FORMAT_RATCHET_FROM" formatCheck :compileJava

      - name: Generate Javadoc coverage report
        run: ./gradlew javadocCoverage

      - name: Upload Javadoc coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javadoc-coverage
          path: build/reports/javadoc-coverage
          if-no-files-found: ignore
